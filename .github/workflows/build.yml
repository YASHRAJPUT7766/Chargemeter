name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle wrapper jar/properties are not in the zip Yash uploaded.
      # This step regenerates them fresh using a system Gradle install,
      # so the wrapper scripts (./gradlew) work for the rest of the build.
      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper missing — generating with Gradle 8.9"
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      # Downloads the two font families the README calls out as
      # intentionally excluded, and places them with the exact filenames
      # Type.kt expects.
      - name: Download required fonts
        run: |
          mkdir -p app/src/main/res/font
          cd app/src/main/res/font
          FONTS_REPO="https://raw.githubusercontent.com/google/fonts/main"
          curl -sL -o jetbrains_mono_regular.ttf   "$FONTS_REPO/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          curl -sL -o jetbrains_mono_medium.ttf    "$FONTS_REPO/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          curl -sL -o jetbrains_mono_semibold.ttf  "$FONTS_REPO/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          curl -sL -o jetbrains_mono_bold.ttf      "$FONTS_REPO/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          curl -sL -o inter_regular.ttf   "$FONTS_REPO/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          curl -sL -o inter_medium.ttf    "$FONTS_REPO/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          curl -sL -o inter_semibold.ttf  "$FONTS_REPO/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          curl -sL -o inter_bold.ttf      "$FONTS_REPO/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          # Android's res/font directory only allows font files (.ttf/.otf/.ttc/.xml).
          # Remove any leftover README so the resource merger doesn't fail on it.
          rm -f README.md
          ls -la

      # Decodes the base64 keystore secret back into a real .jks file on the
      # runner's filesystem, and exports the paths/passwords as env vars that
      # app/build.gradle.kts already reads (CMP_KEYSTORE_PATH etc.) to sign
      # the release build.
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CMP_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "CMP_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CMP_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CMP_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargeMeterPro-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Renames the APK to something stable/readable, then creates (or updates)
      # a GitHub Release tagged by run number and attaches the APK to it.
      # This gives every push a public, downloadable link under the repo's
      # "Releases" tab — no manual upload needed.
      - name: Rename APK for release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/ChargeMeterPro-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChargeMeter Pro — Build #${{ github.run_number }}
          body: |
            Automated signed release build from commit ${{ github.sha }}.
            Download `ChargeMeterPro-release.apk` below and install it on your Android device.
          files: release/ChargeMeterPro-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
